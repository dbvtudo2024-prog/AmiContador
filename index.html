<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      (function() {
        try {
          var realFetch = window.fetch ? window.fetch.bind(window) : null;
          var currentFetch = realFetch;
          Object.defineProperty(window, 'fetch', {
            get: function() {
              return currentFetch;
            },
            set: function(val) {
              currentFetch = val;
            },
            configurable: true,
            enumerable: true
          });
        } catch (e) {}

        window.addEventListener('error', function(event) {
          if (event && event.filename && event.filename.indexOf('chrome-extension://') !== -1) {
            event.preventDefault();
            event.stopPropagation();
          }
        }, true);
      })();
    </script>
    <title>AmiContador - Contador de Voltas para Amigurumi</title>
    <meta name="description" content="Contador inteligente de voltas e pontos para crochê e amigurumi com lembrete de troca de cor, projetos com partes anatômicas e sincronização em nuvem entre celular e PC." />
